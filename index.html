/* ===== Desktop layout (WhatsApp-style) ===== */

@media(min-width:900px){
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 45%,transparent) transparent}

.nav button.on::before{content:'';position:absolute;inset-inline-start:0;top:18%;bottom:18%;width:4px;border-radius:4px;background:linear-gradient(var(--pri),var(--acc))}

const tgCall = body => fetch(CFG.tgFn.replace('telegram-auth', 'telegram-reset'), { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify(body) })
  .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'خطأ'); return d; });
function forgotSheet(pre) {

        code = el('input'), vb = el('button', 'btn', 'تأكيد الرمز'), tg = el('button', 'lnk', '✈️ حسابي عبر Telegram: ادخل مباشرة');

  code.inputMode = 'numeric'; code.dir = 'ltr'; code.placeholder = 'الرمز من الرسالة (إن وصلك)'; code.hidden = vb.hidden = true;
  tg.onclick = () => { bg.remove(); $('#t').click(); };
  const tr = el('button', 'lnk', '✈️ أرسل لي رمزاً على بوت Telegram');
  tr.onclick = () => {
    tr.remove();
    const tm = el('p', 'mut', 'اكتب رقم هاتف حسابك (بنفس الصيغة اللي سجّلتها) ونرسل رمزاً إلى بوت Telegram.'), ph = el('input'), sb = el('button', 'btn', 'أرسل الرمز'),
          tc = el('input'), tv = el('button', 'btn', 'تأكيد الرمز');
    ph.type = 'tel'; ph.dir = 'ltr'; ph.placeholder = '+963 9XX XXX XXX'; ph.autocomplete = 'tel';

    sb.onclick = async () => {
      if (!/^\+?\d{7,15}$/.test(clean(ph.value))) return toast('رقم الهاتف غير صحيح');
      sb.disabled = true;
      try { await tgCall({ action: 'send', phone: clean(ph.value) }); tm.textContent = 'إذا كان الرقم مرتبطاً بحساب Telegram وصلك رمز من البوت. افتح البوت واكتب الرمز هون.'; tc.hidden = tv.hidden = false; sb.textContent = 'إعادة الإرسال'; }
      catch (e) { toast(e.message); }
      sb.disabled = false;
    };
    tv.onclick = async () => {
      if (!/^\d{6}$/.test(tc.value.trim())) return toast('الرمز 6 أرقام');
      tv.disabled = true;
      try { const d = await tgCall({ action: 'verify', phone: clean(ph.value), code: tc.value.trim() }); REC = true; save(d); bg.remove(); await boot(); }
      catch (e) { toast('الرمز غير صحيح أو منتهي'); }
      tv.disabled = false;
    };
  };
  sh.append(msg, em, go, code, vb, tr, tg);
  const mail = () => em.value.trim();
  go.onclick = async () => {
    if (!/^\S+@\S+\.\S+$/.test(mail())) return toast('أدخل بريداً إلكترونياً صحيحاً');
    go.disabled = true;
    try {
      await api('/auth/v1/recover' + (location.protocol === 'file:' ? '' : '?redirect_to=' + encodeURIComponent(location.origin + location.pathname)), { method: 'POST', body: JSON.stringify({ email: mail() }) });
      msg.textContent = 'إذا كان هالبريد مسجّلاً عندنا فقد أرسلنا له رسالة. افتح الرابط منها، أو اكتب الرمز هون.'; code.hidden = vb.hidden = false; go.textContent = 'إعادة الإرسال';
    } catch (e) { toast(e.message); }
    go.disabled = false;
  };
  vb.onclick = async () => {
    const token = code.value.trim(); if (!/^\d{6,8}$/.test(token)) return toast('أدخل الرمز كما وصلك');
    vb.disabled = true;
    try { const d = await api('/auth/v1/verify', { method: 'POST', body: JSON.stringify({ type: 'recovery', email: mail(), token }) }); REC = true; save(d); bg.remove(); await boot(); }
    catch (e) { toast(e.message); }

  };

/* ---------- Live inbox: unread counter in real time ---------- */
let INB = null, INBHB = null, INBT = null, INBR = null, INBD = null, INBREF = 0;
function inboxStop() {
  clearInterval(INBHB); clearInterval(INBR); clearTimeout(INBT); clearTimeout(INBD);
  if (INB) { INB.onclose = null; try { INB.close(); } catch (e) {} INB = null; }
}
function inboxStart() {
  inboxStop();
  if (!S || !ME) return;
  let ws; try { ws = new WebSocket(CFG.url.replace('https', 'wss') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(CFG.key) + '&vsn=1.0.0'); } catch (e) { return; }
  INB = ws;
  const send = (t, event, payload) => { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: t, event, payload, ref: String(++INBREF) })); };
  ws.onopen = () => {
    send('realtime:inbox-' + ME.id, 'phx_join', {
      config: { broadcast: { ack: false, self: false }, presence: { key: '' },
        postgres_changes: [{ event: 'INSERT', schema: 'public', table: 'messages' },
          { event: 'UPDATE', schema: 'public', table: 'chat_members', filter: 'user_id=eq.' + ME.id }] },
      access_token: S.access_token
    });
    INBHB = setInterval(() => send('phoenix', 'heartbeat', {}), 25000);
    inboxSync();
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.event !== 'postgres_changes') return;
    const d = m.payload && m.payload.data;
    if (d && d.table === 'messages' && d.record && d.record.sender_id === ME.id) return;
    inboxSync();
  };
  ws.onclose = () => { clearInterval(INBHB); if (INB === ws) { INB = null; INBT = setTimeout(inboxStart, 3000); } };
  INBR = setInterval(inboxStart, 45 * 60 * 1000);
}
function inboxResume() { if (!S || !ME || $('#app').hidden) return; if (!INB || INB.readyState > 1) inboxStart(); else inboxSync(); }
async function refreshUnread() {
  try {
    const [mem, ms, pf] = await Promise.all([
      api('/rest/v1/chat_members?select=chat_id,last_read_at&user_id=eq.' + ME.id),
      api('/rest/v1/messages?select=chat_id,created_at&sender_id=neq.' + ME.id + '&order=created_at.desc&limit=500'),
      api('/rest/v1/chat_prefs?select=chat_id,muted').catch(() => [])
    ]);
    const mine = {}, muted = {}, n = {}; mem.forEach(r => { mine[r.chat_id] = r.last_read_at; }); pf.forEach(r => { if (r.muted) muted[r.chat_id] = 1; });
    ms.forEach(m => { if (mine[m.chat_id] && m.created_at > mine[m.chat_id] && !muted[m.chat_id] && m.chat_id !== CHAT) n[m.chat_id] = (n[m.chat_id] || 0) + 1; });
    setNavBadge(Object.values(n).reduce((a, b) => a + b, 0));
  } catch (e) {}
}
function inboxSync() {
  clearTimeout(INBD);
  INBD = setTimeout(() => {
    if (!ME || $('#app').hidden) return;
    const typing = i => i && (i.value || document.activeElement === i), busy = document.querySelector('.sbg');
    if (DESK.matches) { if (!typing($('#slist input')) && !busy) return viewChats(true); }
    else if (!CHAT && CURTAB === 'chats') { if (!typing($('#view > input')) && !busy) return viewChats(true); }
    refreshUnread();
  }, 500);
}

  $('#sgo').disabled = false;

async function boot() {
  if (location.hash.includes('access_token')) {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('type') === 'recovery') REC = true;
    if (p.get('access_token')) save({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token') });
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (location.hash.includes('error_code')) { toast('الرابط منتهي أو غير صالح، اطلب رابطاً جديداً'); history.replaceState(null, '', location.pathname + location.search); }
  if (!S) return show('auth');
  try { ME = await api('/auth/v1/user'); } catch (e) { save(null); return show('auth'); }
  try { PROF = (await api('/rest/v1/profiles?id=eq.' + ME.id + '&select=name,phone,avatar_path,hide_last_seen'))[0] || {}; } catch (e) { PROF = {}; }
  if (REC) { REC = false; return showReset(); }
  if (!(ME.user_metadata && ME.user_metadata.setup_done)) return showSetup();
  enterApp();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
{ const rq = (new URLSearchParams(location.search).get('room') || '').toUpperCase(); if (/^[A-Z0-9]{6}$/.test(rq)) { PREF.set('pp_join', rq); history.replaceState(null, '', location.pathname); } }
