<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhilippoPempo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F4B">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#F3F6FC;--card:#fff;--ink:#0B1F4B;--mut:#6B7A99;--pri:#1F4FD8;--acc:#19C3B1;--line:#E3E9F5;--field:#F6F8FD}
@media(prefers-color-scheme:dark){:root{--bg:#0A1226;--card:#121C38;--ink:#EAF0FF;--mut:#8EA0C8;--pri:#4D7BFF;--line:#22305A;--field:#0E1730}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.logo{width:72px;height:72px}.logo.sm{width:34px;height:34px}
.mut{color:var(--mut);font-size:.92rem}
input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);outline:0}
input:focus{border-color:var(--pri)}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:#D6334B;border:1.5px solid var(--line)}
.btn:disabled{opacity:.55}
.lnk{background:0;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:4px}
/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45}
.b1{width:300px;height:300px;background:#2F6BFF;top:-80px;right:-60px}
.b2{width:260px;height:260px;background:var(--acc);bottom:-70px;left:-50px}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:30px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 18px 50px rgba(11,31,75,.14)}
h1{font-weight:800;font-size:1.7rem;letter-spacing:.5px}
.card>*{max-width:100%}.card button,.card input{width:100%}
/* Google: living ring in Google's four colours */
.gbtn{position:relative;border:0;padding:2.5px;border-radius:16px;background:conic-gradient(from var(--a),#4285F4,#EA4335,#FBBC05,#34A853,#4285F4);animation:spin 5s linear infinite;cursor:pointer}
.gbtn span{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--card);border-radius:13.5px;padding:12px;font-weight:600}
.gl{font:800 1.35rem Arial,sans-serif;background:linear-gradient(90deg,#4285F4 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spin{to{--a:360deg}}
/* Telegram: paper plane that keeps taking off */
.tbtn{display:flex;gap:10px;align-items:center;justify-content:center;border:0;border-radius:16px;padding:14.5px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#37AEE2,#1E96C8);overflow:hidden;position:relative}
.tbtn svg{width:22px;height:22px;fill:#fff;animation:fly 2.6s ease-in-out infinite}
.tbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}45%{transform:translate(-5px,-4px) rotate(-12deg)}70%{transform:translate(2px,1px) rotate(4deg)}}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.or{display:flex;align-items:center;gap:10px;width:100%;color:var(--mut);font-size:.85rem}.or i{flex:1;height:1px;background:var(--line)}
.otp{text-align:center;letter-spacing:8px;font-size:1.4rem;font-weight:800}
/* app */
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:1.1rem}
#view{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:0;padding:10px 0 8px;color:var(--mut);font-size:.8rem;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.nav button span{font-size:1.25rem}.nav button.on{color:var(--pri);font-weight:800}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px;border:0;border-radius:16px;background:var(--card);cursor:pointer}
.row .grow{flex:1;font-weight:600}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--pri),var(--acc));flex:none}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}.prof .av{width:72px;height:72px;font-size:1.8rem}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;line-height:1.5;word-break:break-word}
.msg.me{align-self:flex-start;background:var(--pri);color:#fff;border-end-start-radius:5px}
.msg.th{align-self:flex-end;background:var(--card);border-end-end-radius:5px}
.bar{display:flex;gap:8px}.bar .btn{width:auto;padding:0 18px}
.empty{margin:auto;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.msg{cursor:pointer}.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{background:rgba(127,127,127,.22);border-radius:12px;padding:1px 8px;font-size:.85rem}.chip.me{outline:1.5px solid var(--acc)}.rxpick{display:flex;gap:2px;margin-top:6px;background:var(--card);border-radius:16px;padding:4px;width:max-content;max-width:100%}.rxpick button{border:0;background:0;font-size:1.4rem;cursor:pointer;padding:2px 5px}
.quote{background:rgba(127,127,127,.2);border-inline-start:3px solid var(--acc);border-radius:8px;padding:3px 8px;margin-bottom:5px;font-size:.85rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.rbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--field);border-inline-start:3px solid var(--acc);border-radius:10px;font-size:.88rem}.rbar[hidden]{display:none}.rbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rbar button{border:0;background:0;cursor:pointer;color:var(--mut)}#callbtn{margin-inline-start:auto;border:0;background:0;font-size:1.4rem;cursor:pointer}.callbox{position:fixed;inset:0;z-index:60;background:#0B1220;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}.callbox h2{margin:0}.cl{display:flex;flex-direction:column;gap:8px;min-width:220px}.cl div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 14px}.cl .sp{outline:2px solid var(--acc)}.cb{display:flex;gap:14px}.cb button{border:0;border-radius:50%;width:64px;height:64px;font-size:1.6rem;cursor:pointer;background:#2A3548;color:#fff}.cb .end{background:#D6334B}.cb .ok{background:#1FA45B}
.ed{font-size:.7rem;opacity:.6;margin-inline-start:6px}.rxpick button.ed2{font-size:.9rem;font-weight:700}
.sname{font-size:.75rem;font-weight:700;color:var(--acc);margin-bottom:2px}.rxpick button.del{font-size:.9rem;font-weight:700;color:#D6334B}.rxpick button.rp{font-size:.9rem;font-weight:700;color:var(--pri)}
@keyframes sp{to{width:100%}}.sv{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;color:#fff}.sv .bars{display:flex;gap:4px;padding:10px 10px 4px}.sv .bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}.sv .bars b{display:block;height:100%;width:0;background:#fff}.sv .top{display:flex;align-items:center;gap:10px;padding:6px 12px}.sv .grow{flex:1}.sv .body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-size:1.6rem;font-weight:700;overflow:hidden;position:relative;cursor:pointer}.sv .body img{max-width:100%;max-height:100%;object-fit:contain}.sv .cap{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:rgba(0,0,0,.55);font-size:1rem;font-weight:400}.sv>.top button{border:0;background:0;color:#fff;font-size:1.3rem;cursor:pointer}
.msg img{max-width:100%;max-height:320px;border-radius:12px;display:block;min-width:80px;min-height:60px;background:rgba(127,127,127,.15)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:14px;font-size:.92rem}.opt input{width:auto}
.tick{font-size:.72rem;opacity:.85;margin-inline-start:6px}
.badge{background:var(--acc);color:#04342e;border-radius:999px;min-width:22px;padding:2px 8px;font-size:.78rem;font-weight:800;text-align:center}
.bar .att{padding:0 12px;font-size:1.1rem}
#infobtn{border:0;background:0;font-size:1.3rem;cursor:pointer}.ginfo{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));gap:10px;overflow:auto}.ginfo .gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.ginfo .gmem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px}.ginfo .gmem .grow{flex:1;font-weight:600}.ginfo .gmem .rm{border:0;background:0;color:#D6334B;font-size:1.1rem;cursor:pointer}.ginfo .gadd{display:flex;gap:8px}.ginfo .gadd .btn{width:auto;padding:0 16px;white-space:nowrap}
#vcallbtn{border:0;background:0;font-size:1.4rem;cursor:pointer}.callbox{overflow:auto}.vg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:680px}.vg:empty{display:none}.vt{position:relative;flex:1 1 44%;min-width:140px;background:#000;border-radius:14px;overflow:hidden}.vt video{width:100%;display:block;max-height:46vh;object-fit:cover}.vt span{position:absolute;bottom:6px;inset-inline-start:8px;color:#fff;font-size:.8rem;text-shadow:0 0 4px #000}.vt.mine video{transform:scaleX(-1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="logo" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#19C3B1"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><path d="M18 14h28a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H33l-11 9v-9h-4a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="#fff"/><path d="M26 38V23h8.5a5 5 0 0 1 0 10H26" stroke="#1B4FD8" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>

<div id="auth" class="auth" hidden>
  <div class="blob b1"></div><div class="blob b2"></div>
  <main class="card">
    <svg class="logo"><use href="#logo"/></svg>
    <h1>PhilippoPempo</h1>
    <p class="mut">سجّل دخولك وابدأ المحادثة</p>
    <button class="gbtn" id="g"><span><b class="gl">G</b>المتابعة عبر Google</span></button>
    <button class="tbtn" id="t"><svg viewBox="0 0 24 24"><path d="M21.9 3.2 2.6 10.6c-1 .4-1 1.1-.2 1.3l4.9 1.5 1.9 5.8c.2.6.5.8 1 .8s.7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8L23.9 4.7c.4-1.3-.5-1.9-2-1.5zM8.7 13.2l10-6.3c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4z"/></svg>المتابعة عبر Telegram</button>
    <div class="or"><i></i>أو عبر البريد<i></i></div>
    <input id="email" type="email" placeholder="you@gmail.com" dir="ltr" autocomplete="email">
    <div id="otpBox" hidden style="width:100%;display:flex;flex-direction:column;gap:6px">
      <input id="otp" class="otp" inputmode="numeric" maxlength="8" placeholder="••••••" dir="ltr" autocomplete="one-time-code">
      <button class="lnk" id="re">إعادة إرسال الرمز</button>
    </div>
    <button class="btn" id="go">إرسال الرمز</button>
  </main>
</div>

<div id="app" hidden>
  <header><svg class="logo sm"><use href="#logo"/></svg><div><b id="title"></b><div id="sub" class="mut" style="font-size:.78rem;min-height:1em"></div></div><button id="callbtn" hidden title="مكالمة صوتية">📞</button><button id="vcallbtn" hidden title="مكالمة فيديو">🎥</button><button id="infobtn" hidden title="معلومات المجموعة">ℹ️</button></header>
  <section id="view"></section>
  <nav class="nav">
    <button data-t="chats"><span>💬</span>المحادثات</button>
    <button data-t="status"><span>🟢</span>الحالة</button>
    <button data-t="new"><span>➕</span>جديد</button>
    <button data-t="me"><span>👤</span>حسابي</button>
  </nav>
</div>
<div id="toast" role="status"></div>

<script>
/* ---------- Config ---------- */
const CFG = {
  url: 'https://qqbshxboqscutyvkspdd.supabase.co',
  key: 'sb_publishable_L5PrHv3GGdBt51dbw0kKeg_IPs1IYIA',
  tgBotId: '9219126031',
  tgFn: 'https://qqbshxboqscutyvkspdd.supabase.co/functions/v1/telegram-auth'
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200); };
const AV = p => CFG.url + '/storage/v1/object/public/avatars/' + p;
const avatar = (n, p) => {
  const d = el('div', 'av', ([...String(n).trim()][0] || '?').toUpperCase());
  if (p) { const i = new Image(); i.alt = ''; i.onload = () => { d.textContent = ''; d.append(i); }; i.src = AV(p); }
  return d;
};
function squarePhoto(f) {
  return new Promise((ok, no) => {
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => {
      const m = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 256;
      c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, 256, 256);
      URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error('x')), 'image/jpeg', 0.8);
    };
    im.onerror = () => no(new Error('الملف ليس صورة صالحة')); im.src = u;
  });
}
let PROF = {};
const clean = p => p.replace(/[\s-]/g, '');
let S = null, ME = null, CHAT = null, POLL = null, BUSY = false;
try { S = JSON.parse(localStorage.getItem('pp_s') || 'null'); } catch (e) {}
const save = s => { S = s; try { s ? localStorage.setItem('pp_s', JSON.stringify(s)) : localStorage.removeItem('pp_s'); } catch (e) {} };

function msgOf(d) {
  const m = d && (d.msg || d.message || d.error_description || d.error) || '';
  if (/rate limit|429/i.test(m)) return 'محاولات كثيرة، انتظر دقيقة ثم أعد المحاولة.';
  if (/sending.*email/i.test(m)) return 'تعذّر إرسال الإيميل، راجع إعدادات SMTP.';
  if (/expired|invalid/i.test(m)) return 'الرمز غير صحيح أو منتهي، اطلب رمزاً جديداً.';
  return m;
}
const raw = (path, o = {}) => fetch(CFG.url + path, { ...o, headers: { apikey: CFG.key, 'Content-Type': 'application/json', ...(S ? { Authorization: 'Bearer ' + S.access_token } : {}), ...o.headers } });
async function refresh() {
  try {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: S.refresh_token }) });
    const d = await r.json();
    if (r.ok && d.access_token) { save(d); return true; }
  } catch (e) {}
  return false;
}
async function api(path, o) {
  let r;
  try { r = await raw(path, o); } catch (e) { throw new Error('تعذّر الاتصال، تأكد من الإنترنت.'); }
  if (r.status === 401 && S && S.refresh_token && await refresh()) r = await raw(path, o);
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(msgOf(d) || 'حدث خطأ غير متوقع.');
  return d;
}
const show = v => { $('#auth').hidden = v !== 'auth'; $('#app').hidden = v !== 'app'; if (v === 'auth') { clearInterval(POLL); clearInterval(PRES); rtStop(); renderAuth(); } };

/* ---------- Auth ---------- */
function renderAuth() {
  $('#otpBox').hidden = true; $('#email').disabled = false; $('#otp').value = '';
  $('#go').textContent = 'إرسال الرمز';
}
function busy(b) { BUSY = b; $('#go').disabled = b; $('#email').disabled = b || !$('#otpBox').hidden; $('#otp').disabled = b; }
async function sendOtp() {
  const email = $('#email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('أدخل بريداً إلكترونياً صحيحاً');
  busy(true);
  try {
    await api('/auth/v1/otp', { method: 'POST', body: JSON.stringify({ email, create_user: true }) });
    $('#otpBox').hidden = false; $('#go').textContent = 'تأكيد الدخول';
    toast('أرسلنا الرمز إلى بريدك'); busy(false); $('#otp').focus();
  } catch (e) { toast(e.message); busy(false); }
}
async function verify() {
  const code = $('#otp').value.trim();
  if (BUSY || !/^\d{6,8}$/.test(code)) return toast('أدخل الرمز كما وصلك بالبريد');
  busy(true);
  try {
    const d = await api('/auth/v1/verify', { method: 'POST', body: JSON.stringify({ type: 'email', email: $('#email').value.trim(), token: code }) });
    save(d); busy(false); await boot();
  } catch (e) { toast(e.message); $('#otp').value = ''; busy(false); $('#otp').focus(); }
}
$('#go').onclick = () => $('#otpBox').hidden ? sendOtp() : verify();
$('#re').onclick = sendOtp;
$('#email').onkeydown = e => { if (e.key === 'Enter') sendOtp(); };
let otpT;
$('#otp').oninput = e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
  clearTimeout(otpT); const n = e.target.value.length;
  if (n === 8) verify(); else if (n >= 6) otpT = setTimeout(verify, 1200);
};
$('#otp').onkeydown = e => { if (e.key === 'Enter') verify(); };

$('#g').onclick = () => {
  if (location.protocol === 'file:') return toast('Google يحتاج أن يكون التطبيق على رابط https (استضافة)، وسنجهّزه معاً.');
  location.href = CFG.url + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname);
};
$('#t').onclick = async () => {
  if (!CFG.tgBotId || !CFG.tgFn) return toast('الدخول عبر تيليجرام سيتم تفعيله في المرحلة القادمة ✈️');
  try {
    if (!window.Telegram) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-widget.js?22'; s.onload = ok; s.onerror = no; document.head.append(s); });
    Telegram.Login.auth({ bot_id: CFG.tgBotId, request_access: 'write' }, async u => {
      if (!u) return;
      try {
        const r = await fetch(CFG.tgFn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify(u) });
        const d = await r.json();
        if (!r.ok || !d.access_token) throw 0;
        save(d); boot();
      } catch (e) { toast('تعذّر تسجيل الدخول عبر تيليجرام'); }
    });
  } catch (e) { toast('تعذّر تحميل تيليجرام'); }
};

/* ---------- Realtime (Supabase socket, live messages) ---------- */
let WS = null, WSREF = 0, HB = null;
function rtStop() {
  clearInterval(HB);
  if (WS) { WS.onclose = null; try { WS.close(); } catch (e) {} WS = null; }
}
function rtStart(chatId, onChange, onTyping) {
  rtStop();
  const topic = 'realtime:chat-' + chatId;
  try { WS = new WebSocket(CFG.url.replace('https', 'wss') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(CFG.key) + '&vsn=1.0.0'); }
  catch (e) { return; }
  const ws = WS;
  const send = (t, event, payload) => { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: t, event, payload, ref: String(++WSREF) })); };
  ws.onopen = () => {

  if (!S || !ME || CALL || INC || document.hidden) return;
  try {
    const since = new Date(Date.now() - 45000).toISOString();
    const r = await api('/rest/v1/calls?status=eq.ringing&caller_id=neq.' + ME.id + '&created_at=gt.' + encodeURIComponent(since) + '&select=id,chat_id,is_video,profiles(name,phone)&order=created_at.desc&limit=3');
    const c = r.find(x => !DECL.has(x.id)); if (c) showIncoming(c);
  } catch (e) {}
}
async function showIncoming(c) {
  INC = c.id;
  const who = (c.profiles && (c.profiles.name || c.profiles.phone)) || 'مستخدم'; let title = who, sub = c.is_video ? 'مكالمة فيديو واردة…' : 'مكالمة صوتية واردة…', grp = false;
  try { const ch = await api('/rest/v1/chats?id=eq.' + c.chat_id + '&select=is_group,title'); if (ch[0] && ch[0].is_group) { grp = true; title = ch[0].title || 'مجموعة'; sub = who + (c.is_video ? ' يتصل بالمجموعة (فيديو)…' : ' يتصل بالمجموعة…'); } } catch (e) {}
  const box = el('div', 'callbox'), h = el('h2', '', title), s2 = el('div', 'mut', sub), cb = el('div', 'cb'), ok = el('button', 'ok', c.is_video ? '🎥' : '📞'), no = el('button', 'end', '📴');
  cb.append(no, ok); box.append(avatar(title, null), h, s2, cb); document.body.append(box);
  const stopRing = ringer('in'), t0 = document.title; document.title = '📞 مكالمة واردة';
  let poll = null, tmo = null;
  const close = () => { clearInterval(poll); clearTimeout(tmo); stopRing(); box.remove(); INC = null; document.title = t0; };
  ok.onclick = () => { close(); startCall(c.chat_id, title, c.id, !!c.is_video); };
  no.onclick = () => { DECL.add(c.id); close(); if (!grp) endCallRow(c.id); };
  tmo = setTimeout(() => { DECL.add(c.id); close(); }, 45000);
  poll = setInterval(async () => { try { const x = await api('/rest/v1/calls?id=eq.' + c.id + '&select=status'); if (!x[0] || x[0].status !== 'ringing') { DECL.add(c.id); close(); } } catch (e) {} }, 2000);
  if (AUTOANS === c.id) { AUTOANS = null; ok.onclick(); }
}

/* ---------- Push ---------- */
const VAPID_PUB = 'BGT8t2_f8a6hbEq9h0MhGJo3ZJJAslAJXPWuJtuDPDsIqt9lVs-Eq93dnhDw5vIxfeUkJ6TJ7ELZ2zckfG7FOVQ';
function b64u(s) { const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('الجهاز ما بيدعم الإشعارات. على الآيفون ثبّت التطبيق أولاً.');
  if (await Notification.requestPermission() !== 'granted') throw new Error('ما انعطت صلاحية الإشعارات');
  const reg = await navigator.serviceWorker.ready;
  const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
  const j = sub.toJSON();
  await api('/rest/v1/push_subscriptions?on_conflict=endpoint', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: ME.id }) });
}

/* ---------- Boot ---------- */
async function boot() {
  if (location.hash.includes('access_token')) {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('access_token')) save({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token') });
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (!S) return show('auth');
  try { ME = await api('/auth/v1/user'); } catch (e) { save(null); return show('auth'); }
  try { PROF = (await api('/rest/v1/profiles?id=eq.' + ME.id + '&select=name,phone,avatar_path,hide_last_seen'))[0] || {}; } catch (e) { PROF = {}; }
  show('app'); tab('chats'); ping(); startPresence();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
{ const aq = new URLSearchParams(location.search).get('answer'); if (aq) { AUTOANS = aq; history.replaceState(null, '', location.pathname); } }
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.answer) { AUTOANS = ev.data.answer; pollCalls(); } });
setInterval(pollCalls, 3000); setTimeout(pollCalls, 1500);
boot();
</script>
